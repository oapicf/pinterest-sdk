
<h2>QualityComponentDetails</h2>
<ul class="parameter">
  <li class="param-required-true">coverage : BigDecimal
    <br/>Coverage percentage for this event type.
  </li>
</ul>
<ul class="parameter">
  <li class="param-required-false">issues : List
    <br/>List of issues detected for this event type, if any.
  </li>
</ul>
<ul class="parameter">
  <li class="param-required-false">overlap : BigDecimal
    <br/>Overlap percentage for this event type. Only populated for external_event_id
  </li>
</ul>
