
<h2>LabelBulkUpdateRequest</h2>

  </li>
</ul>
<ul class="parameter">
  <li class="param-required-false">status : String
    <br/>Set status to &#x60;ARCHIVED&#x60; to remove the label from the parent entity.
      <dl class="param-enum">
        <dt>Enum:
            <dd>ARCHIVED</dd>
        </dt>
      </dl>
  </li>
</ul>
<ul class="parameter">
  <li class="param-required-false">value : String
    <br/>&lt;/p&gt;&lt;strong&gt;Note:&lt;/strong&gt; value field will be deprecated. Label name. 100-character limit.
  </li>
</ul>
