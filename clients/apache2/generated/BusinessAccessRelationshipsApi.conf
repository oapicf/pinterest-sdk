<Location "/v5/business_access/business_hierarchy/{business_hierarchy_id}/brand_accounts/business_access/business_hierarchy/*/brand_accounts/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit POST>
		Require group biz_access:read
		Require group biz_access:write
	</Limit>
</Location>
