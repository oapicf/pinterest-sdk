<Location "/v5/ad_accounts/{ad_account_id}/labels/{label_id}/apply/ad_accounts/*/labels/*/apply/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit POST>
		Require group ads:write
	</Limit>
</Location>
<Location "/v5/ad_accounts/{ad_account_id}/labels/ad_accounts/*/labels/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit POST>
		Require group ads:write
	</Limit>
	<Limit PATCH>
		Require group ads:write
	</Limit>
</Location>
<Location "/v5/ad_accounts/{ad_account_id}/labels/{label_id}/remove/ad_accounts/*/labels/*/remove/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit POST>
		Require group ads:write
	</Limit>
</Location>
