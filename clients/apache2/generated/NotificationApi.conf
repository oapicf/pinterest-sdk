<Location "/v5/notifications/notifications/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit POST>
		Require group user_accounts:read
	</Limit>
	<Limit POST>
		Require group user_accounts:read
	</Limit>
</Location>
