<Location "/v5/catalogs/available_filter_values/catalogs/available_filter_values/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit GET>
		Require group catalogs:read
	</Limit>
</Location>
<Location "/v5/catalogs/catalogs/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit POST>
		Require group catalogs:write
	</Limit>
	<Limit GET>
		Require group catalogs:read
	</Limit>
</Location>
