<Location "/v5/catalogs/items/catalogs/items/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit POST>
		Require group catalogs:read
	</Limit>
</Location>
<Location "/v5/catalogs/items/batch/{batch_id}/catalogs/items/batch/*/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit GET>
		Require group catalogs:read
	</Limit>
	<Limit GET>
		Require group catalogs:read
	</Limit>
</Location>
<Location "/v5/catalogs/items/batch/catalogs/items/batch/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit POST>
		Require group catalogs:read
		Require group catalogs:write
	</Limit>
	<Limit POST>
		Require group catalogs:read
		Require group catalogs:write
	</Limit>
</Location>
