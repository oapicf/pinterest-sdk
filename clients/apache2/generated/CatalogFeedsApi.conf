<Location "/v5/catalogs/feeds/{feed_id}/processing_results/catalogs/feeds/*/processing_results/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit GET>
		Require group catalogs:read
	</Limit>
</Location>
<Location "/v5/catalogs/feeds/catalogs/feeds/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit POST>
		Require group catalogs:read
		Require group catalogs:write
	</Limit>
	<Limit POST>
		Require group catalogs:read
		Require group catalogs:write
	</Limit>
	<Limit GET>
		Require group catalogs:read
	</Limit>
	<Limit GET>
		Require group catalogs:read
	</Limit>
</Location>
