<Location "/v5/ad_accounts/{ad_account_id}/promotions/ad_accounts/*/promotions/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit POST>
		Require group ads:write
	</Limit>
	<Limit PATCH>
		Require group ads:write
	</Limit>
</Location>
<Location "/v5/ad_accounts/{ad_account_id}/promotions/{promotion_id}/ad_accounts/*/promotions/*/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit DELETE>
		Require group ads:write
	</Limit>
	<Limit GET>
		Require group ads:read
	</Limit>
</Location>
