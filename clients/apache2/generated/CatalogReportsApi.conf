<Location "/v5/catalogs/reports/catalogs/reports/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit POST>
		Require group catalogs:read
	</Limit>
	<Limit GET>
		Require group catalogs:read
	</Limit>
</Location>
<Location "/v5/catalogs/reports/stats/catalogs/reports/stats/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit GET>
		Require group catalogs:read
	</Limit>
</Location>
