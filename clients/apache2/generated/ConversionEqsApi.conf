<Location "/v5/ad_accounts/{ad_account_id}/conversion_eqs/ad_accounts/*/conversion_eqs/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit GET>
		Require group ads:read
	</Limit>
	<Limit GET>
		Require group ads:read
	</Limit>
</Location>
