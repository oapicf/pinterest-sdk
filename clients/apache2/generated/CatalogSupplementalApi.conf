<Location "/v5/catalogs/{catalog_id}/local_inventory_items/query/catalogs/*/local_inventory_items/query/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit POST>
		Require group catalogs:read
	</Limit>
</Location>
