<Location "/v5/ad_accounts/{ad_account_id}/conversion_deletion_requests/ad_accounts/*/conversion_deletion_requests/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit POST>
		Require group ads:write
	</Limit>
	<Limit POST>
		Require group ads:write
	</Limit>
	<Limit GET>
		Require group ads:read
	</Limit>
	<Limit GET>
		Require group ads:read
	</Limit>
</Location>
<Location "/v5/ad_accounts/{ad_account_id}/conversion_deletion_requests/{request_id}/ad_accounts/*/conversion_deletion_requests/*/">
	AuthBasicProvider file
	    AuthUserFile "/var/www/html/htpwd"
	    AuthGroupFile "/var/www/html/groups"
	    AuthType basic
	    AuthName "api"	<LimitExcept GET POST PUT DELETE>
		Require valid-user
	</LimitExcept>
	<Limit DELETE>
		Require group ads:write
	</Limit>
	<Limit DELETE>
		Require group ads:write
	</Limit>
	<Limit GET>
		Require group ads:read
	</Limit>
	<Limit GET>
		Require group ads:read
	</Limit>
</Location>
